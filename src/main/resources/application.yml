spring:
  application:
    name: employee-report-api

  datasource:
    url: jdbc:postgresql://localhost:5454/employee_report
    username: employeeuser
    password: employeepass
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: INFO
